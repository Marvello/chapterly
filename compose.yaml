name: chapterly

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: chapterly-worker
    container_name: chapterly-worker
    restart: unless-stopped
    init: true   # forwards SIGTERM so `docker compose stop` is instant (chapters are saved as they arrive)
    # Must be able to write into the library; use Audiobookshelf's owner.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      CHAPTERLY_MAX_ATTEMPTS: ${CHAPTERLY_MAX_ATTEMPTS:-5}
      # Optional: ask Audiobookshelf to rescan after each EPUB update (all three, or none)
      CHAPTERLY_ABS_URL: ${CHAPTERLY_ABS_URL:-}
      CHAPTERLY_ABS_TOKEN: ${CHAPTERLY_ABS_TOKEN:-}
      CHAPTERLY_ABS_LIBRARY: ${CHAPTERLY_ABS_LIBRARY:-}
      # CHAPTERLY_TICK_MIN: 1          # how often the worker looks for due novels / "check now"
      # CHAPTERLY_RETRY_BASE_MIN: 60
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach services published on the host (e.g. Audiobookshelf)
    volumes:
      - ${CHAPTERLY_DATA_DIR:-chapterly-data}:/data
      - ${CHAPTERLY_LIBRARY_DIR:-./library}:/library

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: chapterly-web
    container_name: chapterly-web
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_PASSWORD_LOGIN: ${AUTH_PASSWORD_LOGIN:-true}
      # Optional OIDC: set all three to add a "Sign in with <AUTH_OIDC_NAME>" button
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_ID: ${AUTH_OIDC_ID:-}
      AUTH_OIDC_SECRET: ${AUTH_OIDC_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
      CHAPTERLY_MAX_ATTEMPTS: ${CHAPTERLY_MAX_ATTEMPTS:-5}
    volumes:
      - ${CHAPTERLY_DATA_DIR:-chapterly-data}:/data
    ports:
      - "${CHAPTERLY_WEB_PORT:-3000}:3000"   # all host interfaces (LAN / VPN); firewall it, never forward it to the internet

# SQLite (WAL) needs every process on one kernel. A named volume keeps the DB inside Docker's Linux
# VM on Docker Desktop (Mac): no file-sharing layer between the two containers and no host access.
# On a Linux host CHAPTERLY_DATA_DIR may point at a host path instead.
volumes:
  chapterly-data:
    name: chapterly-data   # fixed name: independent of the folder / project name
